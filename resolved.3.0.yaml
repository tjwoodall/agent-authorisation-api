                      for the requested service.
                  userAssigned:
                    type: boolean
                    description: Whether the calling agent user is assigned to the
                      client. Present only when agentAuthorised is true.
                  agentType:
                    type: string
                    description: The MTD-IT relationship type. Present only for an
                      authorised MTD-IT relationship.
                    enum:
                    - main
                    - supporting
                    - mtdSignup
