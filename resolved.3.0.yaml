  responses:
    Unauthorized:
      description: The bearer token is missing or is not authorised.
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
          example:
            code: UNAUTHORIZED
            message: Bearer token is missing or not authorized.
    BadRequestArn:
      description: The ARN path parameter is invalid.
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
          example:
            code: ARN_FORMAT_INVALID
            message: Bad Request
    ForbiddenAgent:
      description: The caller is not permitted to access this agency's invitations.
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
          examples:
            notAnAgent:
              value:
                code: NOT_AN_AGENT
                message: This user does not have a Government Gateway agent account.
                  They need to create an Government Gateway agent account before they
                  can use this service.
            agentNotSubscribed:
              value:
                code: AGENT_NOT_SUBSCRIBED
                message: This agent needs to create an agent services account before
                  they can use this service.
            noPermissionOnAgency:
              value:
                code: NO_PERMISSION_ON_AGENCY
                message: The user that is signed in cannot access this authorisation
                  request. Their details do not match the agent business that created
                  the authorisation request.
    BadRequestCreateInvitation:
      description: The request or one of its fields is invalid.
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
          examples:
            invalidPayload:
              value:
                code: INVALID_PAYLOAD
                message: The payload is invalid.
            invalidArn:
              value:
                code: ARN_FORMAT_INVALID
                message: Bad Request
            unsupportedService:
              value:
                code: SERVICE_NOT_SUPPORTED
                message: The service requested is not supported. Check the API documentation
                  to find which services are supported.
            invalidClientId:
              value:
                code: CLIENT_ID_FORMAT_INVALID
                message: Client identifier must be in the correct format. Check the
                  API documentation to find the correct format.
            incompatibleClientId:
              value:
                code: CLIENT_ID_NOT_COMPATIBLE_WITH_SERVICE
                message: The specified client identifier does not match the requested
                  service. Check the API documentation to find the correct format.
            invalidKnownFact:
              value:
                code: KNOWN_FACT_FORMAT_INVALID
                message: Known fact must be in the correct format. Check the API documentation
                  to find the correct format.
            incompatibleKnownFact:
              value:
                code: KNOWN_FACT_INCOMPATIBLE_WITH_SERVICE
                message: The known fact does not match the requested service. Check
                  the API documentation to find the correct format.
            unsupportedAgentType:
              value:
                code: AGENT_TYPE_NOT_SUPPORTED
                message: The agent type requested is not supported. Check the API
                  documentation to find which agent types are supported.
    ForbiddenCreateInvitation:
      description: The caller or client is not permitted to create the invitation.
      content:
        application/json:
          schema:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
              message:
                type: string
          examples:
            notAnAgent:
              value:
                code: NOT_AN_AGENT
                message: This user does not have a Government Gateway agent account.
                  They need to create an Government Gateway agent account before they
                  can use this service.
            agentNotSubscribed:
              value:
                code: AGENT_NOT_SUBSCRIBED
                message: This agent needs to create an agent services account before
                  they can use this service.
            noPermissionOnAgency:
              value:
                code: NO_PERMISSION_ON_AGENCY
                message: The user that is signed in cannot access this authorisation
                  request. Their details do not match the agent business that created
                  the authorisation request.
            clientRegistrationNotFound:
              value:
                code: CLIENT_REGISTRATION_NOT_FOUND
                message: The details provided for this client do not match HMRC's
                  records.
            knownFactDoesNotMatch:
              value:
                code: KNOWN_FACT_DOES_NOT_MATCH
                message: The known fact provided does not match HMRC's record for
                  this client.
            clientInsolvent:
              value:
                code: CLIENT_INSOLVENT
                message: The client cannot authorise an agent because their registration
                  is not active.
            alreadyAuthorised:
              value:
                code: ALREADY_AUTHORISED
                message: The client has already authorised the agent for this service.
                  The agent does not need ask the client for this authorisation again.
            alreadyBeingProcessed:
              value:
                code: ALREADY_BEING_PROCESSED
                message: More than one request received to create the same invitation.
