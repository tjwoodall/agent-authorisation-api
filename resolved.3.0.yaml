  parameters:
    arnParameter:
      name: arn
      in: path
      description: "The agent reference number for the calling agency, including a\
        \ valid check character."
      required: true
      style: simple
      explode: false
      schema:
        pattern: "^[A-Z]ARN[0-9]{7}$"
        type: string
        example: TARN0000001
    invitationIdParameter:
      name: invitationId
      in: path
      description: The unique identifier of the authorisation request.
      required: true
      style: simple
      explode: false
      schema:
        pattern: "^[ABCDEFGHJKLMNOPRSTUWXYZ123456789]{13}$"
        type: string
        example: ABERULMHCKKW3
    serviceParameter:
      name: service
      in: path
      description: The service for the client relationship.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: MTD-IT
        enum:
        - MTD-IT
        - MTD-VAT
        - PILLAR2
        - PPT
        - CGT-PD
        - IRV
        - CBC
        - TRUSTS
    clientIdParameter:
      name: clientId
      in: path
      description: The client identifier for the selected service.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    acceptHeader:
      name: Accept
      in: header
      description: Selects version 3.0 of the API.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        enum:
        - application/vnd.hmrc.3.0+json
    contentTypeHeader:
      name: Content-Type
      in: header
      description: The media type of the request body.
      required: true
      style: simple
      explode: false
      schema:
        type: string
        enum:
        - application/json
  securitySchemes:
    userRestricted:
      type: oauth2
      description: HMRC supports OAuth 2.0 for authenticating user-restricted API
        requests using a bearer token in the Authorization header.
      flows:
        authorizationCode:
          authorizationUrl: https://api.service.hmrc.gov.uk/oauth/authorize
          tokenUrl: https://api.service.hmrc.gov.uk/oauth/token
          refreshUrl: https://api.service.hmrc.gov.uk/oauth/refresh
          scopes:
            read:sent-invitations: Grants read access to sent invitations
            read:check-relationship: Grants read access to check a client relationship
            write:sent-invitations: Grants write access to sent invitations
            write:relationships: Grants write access to client relationships
            write:cancel-invitations: Grants write access to cancel invitations
